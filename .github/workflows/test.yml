name: Run the testsuite

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      # pnpm from the packageManager field, Node.js from .node-version
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
          require-lockfile: true

      - run: pnpm run build

      - run: pnpm run test

  auto-merge:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Automatically merge dependabot upgrades
        uses: fastify/github-action-merge-dependabot@v3.15.0
        with:
          target: minor
